<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · Nova</title>
<style>
  :root {
    --brand-1: #5b5bd6;
    --brand-2: #7c5cf0;
    --brand-3: #38bdf8;
    --ink: #14161f;
    --ink-2: #4a4f60;
    --ink-3: #868ea3;
    --line: #e6e9f2;
    --surface: #ffffff;
    --page: #f4f6fb;
    --danger: #e5484d;
    --ok: #12a594;
    --radius: 16px;
    --shadow-lg: 0 30px 70px -20px rgba(23, 27, 48, .22), 0 8px 24px -12px rgba(23, 27, 48, .12);
    --shadow-sm: 0 1px 2px rgba(20, 22, 31, .05);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: var(--page);
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* ---------- 背景装饰 ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .55;
    animation: float 18s ease-in-out infinite;
  }
  .blob.a { width: 460px; height: 460px; left: -140px; top: -160px; background: #b9b6ff; }
  .blob.b { width: 400px; height: 400px; right: -120px; top: 10%; background: #9fe0ff; animation-delay: -6s; }
  .blob.c { width: 380px; height: 380px; left: 22%; bottom: -180px; background: #ffc9e4; animation-delay: -12s; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(24px, -30px) scale(1.08); }
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(20,22,31,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(20,22,31,.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
  }

  /* ---------- 卡片 ---------- */
  .shell {
    position: relative;
    z-index: 1;
    width: min(1080px, 100%);
    min-height: 620px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    background: var(--surface);
    border-radius: 26px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px) scale(.99); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 左侧品牌区 ---------- */
  .aside {
    position: relative;
    color: #fff;
    padding: 44px 44px 36px;
    background:
      radial-gradient(120% 90% at 10% 0%, rgba(255,255,255,.28), transparent 55%),
      linear-gradient(155deg, var(--brand-1) 0%, var(--brand-2) 52%, #5a34c9 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .aside::after {
    content: "";
    position: absolute; width: 480px; height: 480px; right: -220px; bottom: -220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,.55), transparent 62%);
  }
  .brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.4);
    backdrop-filter: blur(6px);
    font-weight: 800; font-size: 19px;
  }
  .brand-name { font-weight: 700; font-size: 19px; letter-spacing: .5px; }

  .pitch { position: relative; z-index: 1; margin: 40px 0; }
  .pitch h1 {
    font-size: clamp(26px, 2.6vw, 34px);
    line-height: 1.32;
    margin: 0 0 14px;
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .pitch p { margin: 0; color: rgba(255,255,255,.82); font-size: 14.5px; line-height: 1.75; max-width: 34ch; }

  .feats { position: relative; z-index: 1; display: grid; gap: 12px; }
  .feat { display: flex; align-items: center; gap: 11px; font-size: 13.6px; color: rgba(255,255,255,.9); }
  .feat i {
    flex: none; width: 22px; height: 22px; border-radius: 7px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
    display: grid; place-items: center; font-style: normal; font-size: 11px;
  }

  .quote {
    position: relative; z-index: 1; margin-top: 32px;
    padding-top: 22px; border-top: 1px solid rgba(255,255,255,.22);
    font-size: 13px; color: rgba(255,255,255,.78); line-height: 1.7;
  }
  .quote b { color: #fff; font-weight: 600; }

  /* ---------- 右侧表单区 ---------- */
  .main { padding: 52px 56px; display: flex; flex-direction: column; justify-content: center; }
  .main h2 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.2px; }
  .sub { margin: 0 0 30px; color: var(--ink-3); font-size: 14px; }
  .sub a { color: var(--brand-1); text-decoration: none; font-weight: 600; }
  .sub a:hover { text-decoration: underline; }

  .field { margin-bottom: 18px; }
  .field > label {
    display: block; margin-bottom: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
  }
  .control { position: relative; display: flex; align-items: center; }
  .control .icon {
    position: absolute; left: 14px;
    color: var(--ink-3); display: grid; place-items: center;
    pointer-events: none; transition: color .18s;
  }
  .control input {
    width: 100%;
    height: 48px;
    padding: 0 14px 0 42px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
    background: #fbfcfe;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  .control input::placeholder { color: #b3bacb; }
  .control input:hover { border-color: #d3d9e8; }
  .control input:focus {
    background: #fff;
    border-color: var(--brand-1);
    box-shadow: 0 0 0 4px rgba(91, 91, 214, .13);
  }
  .control:focus-within .icon { color: var(--brand-1); }

  .control.has-toggle input { padding-right: 46px; }
  .toggle {
    position: absolute; right: 8px;
    width: 34px; height: 34px; border: 0; border-radius: 9px;
    background: transparent; color: var(--ink-3);
    cursor: pointer; display: grid; place-items: center;
    transition: background .16s, color .16s;
  }
  .toggle:hover { background: #f0f2f8; color: var(--ink-2); }

  /* 错误态 */
  .field.invalid input { border-color: var(--danger); background: #fffafb; }
  .field.invalid input:focus { box-shadow: 0 0 0 4px rgba(229, 72, 77, .12); }
  .field.invalid .icon { color: var(--danger); }
  .error {
    display: none; align-items: center; gap: 5px;
    margin-top: 7px; font-size: 12.5px; color: var(--danger);
  }
  .field.invalid .error { display: flex; }
  .shake { animation: shake .36s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  /* 记住我 / 忘记密码 */
  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 26px; }
  .check { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; font-size: 13.5px; color: var(--ink-2); }
  .check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .box {
    width: 18px; height: 18px; border-radius: 6px; flex: none;
    border: 1.5px solid #cbd1e0; background: #fff;
    display: grid; place-items: center;
    transition: background .16s, border-color .16s;
  }
  .box svg { opacity: 0; transform: scale(.5); transition: opacity .16s, transform .16s; }
  .check input:checked + .box { background: var(--brand-1); border-color: var(--brand-1); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }
  .check input:focus-visible + .box { box-shadow: 0 0 0 4px rgba(91,91,214,.18); }
  .link { font-size: 13.5px; color: var(--brand-1); text-decoration: none; font-weight: 600; }
  .link:hover { text-decoration: underline; }

  /* 主按钮 */
  .btn {
    position: relative;
    width: 100%; height: 50px;
    border: 0; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 600; color: #fff;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    cursor: pointer;
    box-shadow: 0 10px 22px -10px rgba(91, 91, 214, .85);
    transition: transform .14s, box-shadow .2s, filter .2s;
    overflow: hidden;
  }
  .btn:hover { filter: brightness(1.06); box-shadow: 0 14px 28px -10px rgba(91,91,214,.95); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(91,91,214,.25); }
  .btn[disabled] { cursor: not-allowed; filter: saturate(.7) brightness(1.02); }
  .btn .label { transition: opacity .2s; }
  .btn .spin {
    position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0; transition: opacity .2s;
  }
  .btn.loading .label { opacity: 0; }
  .btn.loading .spin { opacity: 1; }
  .btn.loading { pointer-events: none; }
  .spinner {
    width: 19px; height: 19px; border-radius: 50%;
    border: 2.2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 分割线 */
  .divider { display: flex; align-items: center; gap: 14px; margin: 26px 0 18px; color: var(--ink-3); font-size: 12.5px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* 第三方登录 */
  .oauth { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .oauth button {
    height: 46px; border-radius: 12px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--line);
    font-family: inherit; font-size: 13.5px; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color .16s, background .16s, transform .14s;
  }
  .oauth button:hover { border-color: #c9d0e2; background: #fafbff; }
  .oauth button:active { transform: translateY(1px); }

  .foot { margin: 28px 0 0; text-align: center; font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
  .foot a { color: var(--ink-2); }

  /* ---------- 右上角提示 ---------- */
  .toast-wrap { position: fixed; top: 22px; right: 22px; z-index: 50; display: grid; gap: 10px; }
  .toast {
    display: flex; align-items: center; gap: 10px;
    min-width: 260px; padding: 13px 16px;
    background: #fff; border-radius: 13px;
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px -16px rgba(23,27,48,.3);
    font-size: 13.5px; color: var(--ink);
    animation: toastIn .34s cubic-bezier(.2,.9,.25,1) both;
  }
  .toast.out { animation: toastOut .28s ease forwards; }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .toast.ok .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(18,165,148,.16); }
  .toast.err .dot { background: var(--danger); box-shadow: 0 0 0 4px rgba(229,72,77,.16); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(18px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(18px) scale(.97); } }

  /* ---------- 响应式 ---------- */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; min-height: 0; }
    .aside { padding: 32px 30px 28px; }
    .pitch { margin: 26px 0 0; }
    .pitch h1 { font-size: 24px; }
    .feats, .quote { display: none; }
    .main { padding: 34px 28px 38px; }
  }
  @media (max-width: 420px) {
    body { padding: 14px; }
    .shell { border-radius: 20px; }
    .main { padding: 28px 20px 30px; }
    .oauth { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="grid-lines"></div>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>
</div>

<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

<div class="shell">
  <!-- 左：品牌 -->
  <aside class="aside">
    <div class="brand">
      <div class="logo">N</div>
      <div class="brand-name">Nova</div>
    </div>

    <div class="pitch">
      <h1>欢迎回来<br />继续你的工作</h1>
      <p>一个账号，打通项目协作、数据看板与自动化流程。登录后即可接着上次的进度继续。</p>
    </div>

    <div>
      <div class="feats">
        <div class="feat"><i>✓</i> 端到端加密，数据仅你可见</div>
        <div class="feat"><i>✓</i> 多设备实时同步，随时切换</div>
        <div class="feat"><i>✓</i> 团队空间与精细化权限管理</div>
      </div>
      <div class="quote">
        “<b>把重复的事交出去</b>，把时间留给真正重要的判断。”
      </div>
    </div>
  </aside>

  <!-- 右：表单 -->
  <main class="main">
    <h2>账号登录</h2>
    <p class="sub">还没有账号？<a href="#" id="toRegister">立即注册</a></p>

    <form id="loginForm" novalidate>
      <div class="field" id="f-email">
        <label for="email">邮箱 / 手机号</label>
        <div class="control">
          <span class="icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3" />
              <path d="m3 7 8.1 5.6a1.6 1.6 0 0 0 1.8 0L21 7" />
            </svg>
          </span>
          <input id="email" name="email" type="text" autocomplete="username"
                 placeholder="you@example.com" aria-describedby="e-email" />
        </div>
        <p class="error" id="e-email">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9.5" /><path d="M12 7.5v5.5M12 16.4v.1" />
          </svg>
          <span></span>
        </p>
      </div>

      <div class="field" id="f-pwd">
        <label for="password">密码</label>
        <div class="control has-toggle">
          <span class="icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <rect x="4" y="10.2" width="16" height="10.3" rx="2.6" />
              <path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8" />
            </svg>
          </span>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="请输入密码" aria-describedby="e-pwd" />
          <button class="toggle" type="button" id="pwdToggle" aria-label="显示密码" aria-pressed="false">
            <svg id="eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M1.8 12S5.4 5.6 12 5.6 22.2 12 22.2 12 18.6 18.4 12 18.4 1.8 12 1.8 12Z" />
              <circle cx="12" cy="12" r="3.1" />
            </svg>
          </button>
        </div>
        <p class="error" id="e-pwd">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9.5" /><path d="M12 7.5v5.5M12 16.4v.1" />
          </svg>
          <span></span>
        </p>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember" checked />
          <span class="box">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="m4.5 12.5 5 5 10-11" />
            </svg>
          </span>
          记住我
        </label>
        <a class="link" href="#" id="toForgot">忘记密码？</a>
      </div>

      <button class="btn" type="submit" id="submitBtn">
        <span class="label">登录</span>
        <span class="spin"><span class="spinner"></span></span>
      </button>
    </form>

    <div class="divider">或使用以下方式登录</div>

    <div class="oauth">
      <button type="button" data-p="微信">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#07C160"><path d="M9.2 3C4.9 3 1.5 5.8 1.5 9.3c0 2 1.1 3.7 2.9 4.9l-.7 2.2 2.5-1.3c.6.2 1.3.3 2 .3h.6a5.6 5.6 0 0 1-.2-1.5c0-3.2 3.1-5.8 7-5.8h.6C15.6 5 12.7 3 9.2 3Zm-2.5 3.4a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9Zm5 0a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9Z"/><path d="M22.5 13.9c0-2.8-2.8-5.1-6.2-5.1s-6.2 2.3-6.2 5.1 2.8 5.1 6.2 5.1c.6 0 1.1-.1 1.7-.2l2.1 1.1-.6-1.8c1.8-.9 3-2.5 3-4.2Zm-8.2-1.6a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Zm4.1 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Z"/></svg>
        微信
      </button>
      <button type="button" data-p="GitHub">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#181717"><path d="M12 1.8a10.2 10.2 0 0 0-3.2 19.9c.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.2-1.5-1.2-1.5-.9-.7.1-.7.1-.7 1 .1 1.6 1.1 1.6 1.1.9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.7-1.4-2.3-.3-4.7-1.1-4.7-5.1 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.7 0 0 .9-.3 2.8 1a9.7 9.7 0 0 1 5.2 0c1.9-1.3 2.8-1 2.8-1 .6 1.4.2 2.4.1 2.7.7.7 1 1.6 1 2.7 0 4-2.4 4.8-4.7 5.1.4.4.7 1 .7 2v2.9c0 .3.2.6.7.5A10.2 10.2 0 0 0 12 1.8Z"/></svg>
        GitHub
      </button>
      <button type="button" data-p="企业 SSO">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5b5bd6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17M5.5 20.5V6.2L12 3.5l6.5 2.7v14.3M9.6 10h1.2M13.2 10h1.2M9.6 13.6h1.2M13.2 13.6h1.2M11 20.5v-3.2h2v3.2"/></svg>
        SSO
      </button>
    </div>

    <p class="foot">
      登录即表示你同意我们的 <a href="#">服务条款</a> 与 <a href="#">隐私政策</a>
    </p>
  </main>
</div>

<script>
(function () {
  "use strict";

  var form     = document.getElementById("loginForm");
  var emailEl  = document.getElementById("email");
  var pwdEl    = document.getElementById("password");
  var fEmail   = document.getElementById("f-email");
  var fPwd     = document.getElementById("f-pwd");
  var btn      = document.getElementById("submitBtn");
  var toggle   = document.getElementById("pwdToggle");
  var eye      = document.getElementById("eye");
  var toasts   = document.getElementById("toasts");

  var EYE_OPEN  = '<path d="M1.8 12S5.4 5.6 12 5.6 22.2 12 22.2 12 18.6 18.4 12 18.4 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1"/>';
  var EYE_SHUT  = '<path d="M4.2 4.2 19.8 19.8"/><path d="M9.6 5.9A9.7 9.7 0 0 1 12 5.6c6.6 0 10.2 6.4 10.2 6.4a17.9 17.9 0 0 1-3.5 4.2M6.3 7.9A18 18 0 0 0 1.8 12s3.6 6.4 10.2 6.4c1.3 0 2.4-.2 3.4-.6"/><path d="M9.9 10.1a3.1 3.1 0 0 0 4.3 4.3"/>';

  /* ------ 提示 ------ */
  function toast(msg, type) {
    var el = document.createElement("div");
    el.className = "toast " + (type === "err" ? "err" : "ok");
    el.innerHTML = '<span class="dot"></span><span></span>';
    el.lastChild.textContent = msg;
    toasts.appendChild(el);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () { el.remove(); }, 300);
    }, 2600);
  }

  /* ------ 校验 ------ */
  function setError(field, msg) {
    field.classList.add("invalid");
    field.querySelector(".error span").textContent = msg;
    field.classList.remove("shake");
    void field.offsetWidth;          /* 重排以重放动画 */
    field.classList.add("shake");
  }
  function clearError(field) { field.classList.remove("invalid", "shake"); }

  function checkEmail(silent) {
    var v = emailEl.value.trim();
    if (!v) { if (!silent) setError(fEmail, "请输入邮箱或手机号"); return false; }
    var isMail   = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    var isPhone  = /^1[3-9]\d{9}$/.test(v);
    if (!isMail && !isPhone) { if (!silent) setError(fEmail, "邮箱或手机号格式不正确"); return false; }
    clearError(fEmail); return true;
  }
  function checkPwd(silent) {
    var v = pwdEl.value;
    if (!v)            { if (!silent) setError(fPwd, "请输入密码"); return false; }
    if (v.length < 6)  { if (!silent) setError(fPwd, "密码至少 6 位"); return false; }
    clearError(fPwd); return true;
  }

  emailEl.addEventListener("blur", function () { if (emailEl.value) checkEmail(); });
  pwdEl.addEventListener("blur",   function () { if (pwdEl.value)   checkPwd(); });
  emailEl.addEventListener("input", function () { clearError(fEmail); });
  pwdEl.addEventListener("input",   function () { clearError(fPwd); });

  /* 大写锁定提示 */
  pwdEl.addEventListener("keyup", function (e) {
    if (e.getModifierState && e.getModifierState("CapsLock")) {
      fPwd.querySelector(".error span").textContent = "大写锁定已开启";
      fPwd.classList.add("invalid");
    } else if (fPwd.querySelector(".error span").textContent === "大写锁定已开启") {
      clearError(fPwd);
    }
  });

  /* ------ 密码可见性 ------ */
  toggle.addEventListener("click", function () {
    var show = pwdEl.type === "password";
    pwdEl.type = show ? "text" : "password";
    eye.innerHTML = show ? EYE_SHUT : EYE_OPEN;
    toggle.setAttribute("aria-pressed", String(show));
    toggle.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
    pwdEl.focus();
  });

  /* ------ 提交（此处为纯前端演示，替换为真实接口即可） ------ */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var okE = checkEmail(), okP = checkPwd();
    if (!okE) { emailEl.focus(); return; }
    if (!okP) { pwdEl.focus(); return; }

    btn.classList.add("loading");
    btn.disabled = true;

    /* ==== 接入真实后端：把下面的 setTimeout 换成 fetch ====
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        account:  emailEl.value.trim(),
        password: pwdEl.value,
        remember: document.getElementById("remember").checked
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.code === 0) { location.href = "/dashboard"; }
        else { toast(res.message || "账号或密码错误", "err"); }
      })
      .catch(function () { toast("网络异常，请稍后重试", "err"); })
      .finally(function () { btn.classList.remove("loading"); btn.disabled = false; });
    ================================================== */

    setTimeout(function () {
      btn.classList.remove("loading");
      btn.disabled = false;

      /* 演示：密码 = 123456 视为成功 */
      if (pwdEl.value === "123456") {
        toast("登录成功，正在跳转…", "ok");
        setTimeout(function () { toast("演示页面：此处应跳转到控制台", "ok"); }, 900);
      } else {
        toast("账号或密码错误，请重试", "err");
        setError(fPwd, "密码不正确");
        pwdEl.select();
      }
    }, 1100);
  });

  /* ------ 占位交互 ------ */
  [["toForgot", "忘记密码流程待接入"], ["toRegister", "注册页面待接入"]].forEach(function (pair) {
    var el = document.getElementById(pair[0]);
    if (el) el.addEventListener("click", function (e) { e.preventDefault(); toast(pair[1], "ok"); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".oauth button"), function (b) {
    b.addEventListener("click", function () { toast("即将通过 " + b.dataset.p + " 授权登录", "ok"); });
  });

  /* 自动聚焦 */
  if (window.matchMedia("(min-width: 901px)").matches) emailEl.focus();
})();
</script>
</body>
</html>
