# 开发环境配置：Spring Boot 跑在 8080，供前端 Vite(5173) 通过 /api 代理调用
server.port=8080

# ===== 数据源：本地 MySQL（root / 123456） =====
spring.datasource.url=jdbc:mysql://localhost:3306/boonie_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
logging.level.com.baomidou.mybatisplus=warn
