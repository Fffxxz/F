spring.application.name=springBootTest
spring.profiles.active=dev

# ==========================================================
# 数据源（MySQL 8.0，本地，库名 springboot_auth）
# 建库建表脚本见项目根目录 sql/springboot_auth.sql
# ==========================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# HikariCP 连接池（Spring Boot 默认）
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=30000

# ==========================================================
# MyBatis-Plus
# ==========================================================
# 下划线列名 -> 驼峰属性名（created_at -> createdAt）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印执行的 SQL，便于学习/排查
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false
# 主键策略：跟随数据库自增
mybatis-plus.global-config.db-config.id-type=auto

# ==========================================================
# 日志
# ==========================================================
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
